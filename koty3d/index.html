<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#8FD8F0">
<title>Три кота — за рыбкой</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="c"></canvas>

<div class="hud">
  <div class="pill fish">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12c3-4 7-5.5 10-4.5 2 .7 3.5 2.4 4.5 4.5-1 2.1-2.5 3.8-4.5 4.5C10 17.5 6 16 3 12z" fill="currentColor"/><path d="M17.5 12l4-3v6l-4-3z" fill="currentColor"/><circle cx="7" cy="11" r="1.2" fill="#fff"/></svg>
    <span id="count">0</span><span class="of">/</span><span id="need">6</span>
  </div>
  <div class="pill lvl">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8l2.75 5.9 6.45.8-4.8 4.35 1.3 6.35L12 17.2 6.3 20.2l1.3-6.35L2.8 9.5l6.45-.8L12 2.8z"/></svg>
    <span id="lvl">1</span>
  </div>
</div>

<div class="tools">
  <button class="rbtn" id="sound" aria-label="Звук">
    <svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L13 5v14L7.5 14.5H4z" fill="currentColor"/><path d="M16.6 8.4a5 5 0 0 1 0 7.2M19 6a8.4 8.4 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/></svg>
  </button>
  <button class="rbtn" id="home" aria-label="Домой">
    <svg viewBox="0 0 24 24"><path d="M4 11.2 12 4l8 7.2M6.5 10v9h4v-5h3v5h4v-9" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
</div>

<div class="ov" id="ov"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script src="game.js" type="module"></script>
</body>
</html>
