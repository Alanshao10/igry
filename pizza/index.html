<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#FFE7C8">
<link rel="icon" href="data:,">
<title>Пицца</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wall"></div>

<div class="hud">
  <div class="pill lvl"><svg viewBox="0 0 24 24"><path d="M12 2.8l2.75 5.9 6.45.8-4.8 4.35 1.3 6.35L12 17.2 6.3 20.2l1.3-6.35L2.8 9.5l6.45-.8L12 2.8z"/></svg><span id="lvl">1</span></div>
  <div class="pill steps"><span id="doneCount">0</span><span class="of">/</span><span id="needCount">2</span></div>
</div>

<main class="stage">

  <section class="order">
    <div class="cat" id="cat"></div>
    <div class="bubble">
      <div class="want" id="want"></div>
    </div>
  </section>

  <section class="pizza-zone">
    <div class="pizza" id="pizza">
      <div class="toppings" id="toppings"></div>
    </div>
  </section>

  <section class="shelf" id="shelf"></section>

</main>

<div class="tools">
  <button class="rbtn" id="home" aria-label="Домой">
    <svg viewBox="0 0 24 24"><path d="M4 11.2 12 4l8 7.2M6.5 10v9h4v-5h3v5h4v-9" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <button class="rbtn" id="sound" aria-label="Звук">
    <svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L13 5v14L7.5 14.5H4z" fill="currentColor"/><path d="M16.6 8.4a5 5 0 0 1 0 7.2M19 6a8.4 8.4 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/></svg>
  </button>
</div>

<div class="ov" id="ov"></div>

<script src="game.js"></script>
</body>
</html>
